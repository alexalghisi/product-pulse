name: ci

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pulse" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      clickhouse:
        image: clickhouse/clickhouse-server:26.10
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["8130:8123"]
    env:
      PULSE_DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse
      PULSE_CLICKHOUSE_URL: http://127.0.0.1:8130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
      - name: Offline evals
        run: |
          python manage.py migrate
          python manage.py clickhouse_migrate
          python -m product_pulse.evals --model offline --threshold 0.8

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
